name: Audit

# Checks every installed package, extension and website, against published
# security advisories.
#
# GitHub's dependency graph reads package.json but not bun.lock, so Dependabot
# alerts only cover direct dependencies. This covers the whole tree.
#
# Deliberately not a required check: a newly published advisory would otherwise
# block every pull request, engine updates included, until someone fixed it. A
# failure here notifies the repository owner instead.
on:
  schedule:
    - cron: "0 21 * * 0" # Mondays, 08:00 in Sydney (AEDT)
  pull_request:
    paths: ["package.json", "bun.lock", "site/package.json", "site/bun.lock", ".github/workflows/audit.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: audit dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Third-party, so pinned to a reviewed commit; Dependabot moves the pin.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"

      - name: Extension
        run: |
          bun install --frozen-lockfile
          bun audit

      # GHSA-rj75-hqrm-r3gf: postcss-selector-parser 6 arrives through Starlight's
      # code highlighter (expressive-code > postcss-nested), which doesn't support
      # the fixed major version yet. It only parses the site's own CSS at build
      # time, never visitors' input. Remove the exception once the chain updates.
      - name: Website
        working-directory: site
        run: |
          bun install --frozen-lockfile
          bun audit --ignore=GHSA-rj75-hqrm-r3gf
