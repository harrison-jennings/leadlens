name: Site

# Builds the website whenever it, or the documentation it publishes, changes.
# Cloudflare Workers Builds deploys it; this catches a broken build in the pull request itself.
on:
  push:
    branches: [main]
    paths: ["site/**", "docs/**", "CHANGELOG.md", "samples/images/**", "package.json", ".github/workflows/site.yml"]
  pull_request:
    paths: ["site/**", "docs/**", "CHANGELOG.md", "samples/images/**", "package.json", ".github/workflows/site.yml"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build the website
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7

      # Astro runs on Node, and its releases raise the minimum version; the
      # runner's preinstalled Node can lag behind. Workers Builds uses Node 24
      # by default, the major version `engines` in site/package.json names.
      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      # Third-party, so pinned to a reviewed commit; Dependabot moves the pin.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"

      - run: bun install --frozen-lockfile

      # Fails if a docs page links somewhere the site can't publish.
      - run: bun run build

      # Cloudflare serves the headers file and adds the analytics script, which
      # the security policy must allow. Nothing may block indexing, and each
      # page keeps the tags search results and link previews use.
      - name: Check headers and indexing
        run: |
          grep -q "connect-src 'self';" dist/_headers
          grep -q 'https://static.cloudflareinsights.com' dist/_headers
          # (`! grep` can't fail a step: the shell ignores a negated command's failure)
          if grep -rl 'noindex' dist --include='*.html'; then echo 'a page asks not to be indexed'; exit 1; fi
          grep -q 'Sitemap:' dist/robots.txt
          for page in dist/index.html dist/docs/index.html dist/docs/linting/index.html dist/changelog/index.html; do
            grep -q '<link rel="canonical" href="https://leadlens.harrisonjennings.au/' "$page"
            grep -q '<meta name="description"' "$page"
            grep -q '<meta property="og:image"' "$page"
          done
          grep -q '<meta property="og:title" content="Lint HTML email' dist/docs/linting/index.html
          echo "headers in place; pages indexable, with canonical, description and social tags"
