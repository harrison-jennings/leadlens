<!DOCTYPE html>
<html>
<head>
  <title>Your order has shipped</title>
  <style>
    .card { border-radius: 8px; padding: 24px; background: #ffffff; }
    .row { display: flex; gap: 16px; }
    .muted { color: #767676; font-size: 0.875rem; }
    .cta { transition: background 0.2s ease; }
  </style>
</head>
<body style="margin:0;padding:0;background:#f4f4f5">
  <table role="presentation" width="600" cellpadding="0" cellspacing="0">
    <tr>
      <td class="card">
        <img src="https://example.com/logo.png" width="140">
        <h1 style="font-size:1.5rem;letter-spacing:-0.5px">Order #4182 is on its way</h1>
        <div class="row">
          <p class="muted">Estimated delivery: Thursday</p>
          <p class="muted">Tracking: 1Z999AA10123456784</p>
        </div>
        <a class="cta" href="http://example.com/track" style="border-radius:6px;padding:12px 20px;background:#1a1a1a;color:#ffffff">Track your parcel</a>
      </td>
    </tr>
  </table>
</body>
</html>
